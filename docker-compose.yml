name: matflote

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TZ: Europe/Oslo
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DinnerPlanner: Data Source=/data/dinnerplanner.db
      ImageStorage__RootPath: /data/images
      ShoppingListExport__Provider: ${SHOPPING_LIST_EXPORT_PROVIDER:-Vikunja}
      ShoppingListExport__TaskMode: ${SHOPPING_LIST_EXPORT_TASK_MODE:-SingleTask}
      Vikunja__BaseUrl: ${VIKUNJA_BASE_URL:-}
      Vikunja__ApiToken: ${VIKUNJA_API_TOKEN:-}
      Vikunja__ProjectId: ${VIKUNJA_PROJECT_ID:-}
      Kassalapp__BaseUrl: ${KASSALAPP_BASE_URL:-https://kassal.app/api/v1}
      Kassalapp__ApiKey: ${KASSALAPP_API_KEY:-}
      Helsedirektoratet__BaseUrl: ${HELSEDIREKTORATET_BASE_URL:-https://api.helsedirektoratet.no}
      Helsedirektoratet__SubscriptionKey: ${HELSEDIREKTORATET_SUBSCRIPTION_KEY:-}
    volumes:
      - matflote-data:/data
      - matflote-images:/data/images
    expose:
      - "8080"
    # The same check is built into the image; it is repeated here so it is visible and easy to tune.
    # The aspnet image has no curl or wget, so the app checks its own /health.
    healthcheck:
      test: ["CMD", "dotnet", "backend.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      TZ: Europe/Oslo
    ports:
      - "${MATFLOTE_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  matflote-data:
    name: matflote-data
  matflote-images:
    name: matflote-images
