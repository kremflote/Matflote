name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Matflote.sln

      - name: Build
        run: dotnet build Matflote.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Matflote.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend lint, type-check, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Not blocking yet: lint still reports react-hooks/set-state-in-effect and
      # react-refresh/only-export-components errors that later packages fix as they
      # touch those files. Remove continue-on-error once `npm run lint` reaches zero.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
